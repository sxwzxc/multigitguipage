name: Update installer from MultiGitGui release

# 手动触发：自动获取 sxwzxc/MultiGitGui 最新 Release，按 MultiGitGui-Setup-*.exe 匹配
# 安装包资产，下载 → 分片入库 → 更新直链与版本号 → 构建验证 → 提交推送。
# 注意：直链指向 multigit.shenxw.cn，该服务器上的安装包与 index.html 需另行同步（FTP）。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'MultiGitGui release tag to fetch (default: latest)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve installer asset
        id: release
        env:
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            api="https://api.github.com/repos/sxwzxc/MultiGitGui/releases/tags/${TAG}"
          else
            api="https://api.github.com/repos/sxwzxc/MultiGitGui/releases/latest"
          fi
          json="$(curl -fsSL -H "Authorization: Bearer ${GH_API_TOKEN}" -H "Accept: application/vnd.github+json" "${api}")"
          asset="$(printf '%s' "$json" | jq -r '.assets[] | select(.name | test("^MultiGitGui-Setup-.*\\.exe$")) | .name' | sort -V | tail -n 1)"
          if [ -z "$asset" ] || [ "$asset" = "null" ]; then
            echo "::error::No MultiGitGui-Setup-*.exe asset in release. Available assets:"
            printf '%s' "$json" | jq -r '.assets[].name' | sed 's/^/  - /'
            exit 1
          fi
          version="$(printf '%s' "$asset" | sed -E 's/^MultiGitGui-Setup-([0-9]+\.[0-9]+\.[0-9]+)\.exe$/\1/')"
          if [ -z "$version" ] || [ "$version" = "$asset" ]; then
            echo "::error::Asset name does not match MultiGitGui-Setup-<major.minor.patch>.exe: ${asset}"
            exit 1
          fi
          url="$(printf '%s' "$json" | jq -r --arg n "$asset" '.assets[] | select(.name == $n) | .url')"
          changelog="$(printf '%s' "$json" | jq -r '.assets[] | select(.name | test("^CHANGELOG\\.md$"; "i")) | .name' | head -n 1)"
          if [ -z "$changelog" ] || [ "$changelog" = "null" ]; then
            echo "::error::No CHANGELOG.md asset in release. Available assets:"
            printf '%s' "$json" | jq -r '.assets[].name' | sed 's/^/  - /'
            exit 1
          fi
          changelog_url="$(printf '%s' "$json" | jq -r --arg n "$changelog" '.assets[] | select(.name == $n) | .url')"
          published_at="$(printf '%s' "$json" | jq -r '.published_at // empty')"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "changelog=${changelog}" >> "$GITHUB_OUTPUT"
          echo "changelog_url=${changelog_url}" >> "$GITHUB_OUTPUT"
          echo "published_at=${published_at}" >> "$GITHUB_OUTPUT"
          echo "Resolved asset: ${asset} (v${version}), changelog: ${changelog}"

      - name: Download installer
        env:
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p installer
          curl -fsSL -H "Authorization: Bearer ${GH_API_TOKEN}" -H "Accept: application/octet-stream" \
            -o "installer/${{ steps.release.outputs.asset }}" \
            "${{ steps.release.outputs.url }}"
          ls -lh "installer/${{ steps.release.outputs.asset }}"

      - name: Download CHANGELOG.md
        env:
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer ${GH_API_TOKEN}" -H "Accept: application/octet-stream" \
            -o /tmp/CHANGELOG.md \
            "${{ steps.release.outputs.changelog_url }}"
          echo "Downloaded ${{ steps.release.outputs.changelog }}:"
          head -n 5 /tmp/CHANGELOG.md

      - name: Remove stale shards
        run: rm -f public/downloads/*.part*

      - name: Shard installer
        run: |
          set -euo pipefail
          node scripts/split-installer.mjs "installer/${{ steps.release.outputs.asset }}" public/downloads --emit /tmp/shard-meta.json
          cat /tmp/shard-meta.json

      - name: Verify shards
        run: |
          node -e "
            const fs = require('fs');
            const crypto = require('crypto');
            const meta = JSON.parse(fs.readFileSync('/tmp/shard-meta.json', 'utf8'));
            const chunks = Array.from({ length: meta.parts }, (_, i) =>
              fs.readFileSync('public/downloads/' + meta.file + '.part' + (i + 1))
            );
            const merged = Buffer.concat(chunks);
            const sha = crypto.createHash('sha256').update(merged).digest('hex');
            if (sha !== meta.sha256 || merged.length !== meta.size) {
              console.error('SHA-256 mismatch: ' + sha);
              process.exit(1);
            }
            console.log('Shards verified: ' + merged.length + ' bytes, sha256=' + sha);
          "

      - name: Bump version references
        run: |
          set -euo pipefail
          meta="$(cat /tmp/shard-meta.json)"
          file="$(printf '%s' "$meta" | jq -r .file)"
          size="$(printf '%s' "$meta" | jq -r .size)"
          parts="$(printf '%s' "$meta" | jq -r .parts)"
          sha="$(printf '%s' "$meta" | jq -r .sha256)"
          node scripts/bump-version.mjs "${file}" "${size}" "${parts}" "${sha}" \
            --changelog /tmp/CHANGELOG.md \
            --published-at "${{ steps.release.outputs.published_at }}"
          git diff --stat

      - name: Build
        run: npm run build

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ver="${{ steps.release.outputs.version }}"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: installer v${ver} synced from MultiGitGui release"
          git push
