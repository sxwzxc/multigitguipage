name: Forward MultiGitGui release to this repo

# 手动触发：把 sxwzxc/MultiGitGui（private）的最新 Release 转发发布到
# 本仓库（public）的 GitHub Release——下载全部资产（含安装包）后上传到
# 本仓库同名 tag 的 Release，body 一并转发；成功后自动触发
# Update installer from MultiGitGui release 工作流（分片 + 直链更新）。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'MultiGitGui release tag to forward (default: latest)'
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source release
        id: source
        env:
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "$TAG" ]; then
            api="https://api.github.com/repos/sxwzxc/MultiGitGui/releases/tags/${TAG}"
          else
            api="https://api.github.com/repos/sxwzxc/MultiGitGui/releases/latest"
          fi
          json="$(curl -fsSL -H "Authorization: Bearer ${GH_API_TOKEN}" -H "Accept: application/vnd.github+json" "${api}")"
          tag="$(printf '%s' "$json" | jq -r .tag_name)"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "::error::Source release not found"
            exit 1
          fi
          printf '%s' "$json" | jq -r '.assets[] | [.name, .url, .size] | @tsv' > /tmp/assets.tsv
          printf '%s' "$json" | jq -r .body > /tmp/release-body.md
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved source release: ${tag}, assets: $(wc -l < /tmp/assets.tsv)"

      - name: Get or create target release
        id: target
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.source.outputs.tag }}"
          api="https://api.github.com/repos/sxwzxc/multigitguipage/releases/tags/${tag}"
          code="$(curl -s -o /tmp/target.json -w '%{http_code}' -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" "${api}")"
          if [ "$code" = "404" ]; then
            body="Auto-forwarded from the MultiGitGui release (private repo).

            $(cat /tmp/release-body.md)"
            payload="$(jq -n --arg tag "$tag" --arg name "MultiGitGui $tag" --arg body "$body" '{tag_name:$tag,name:$name,body:$body}')"
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -d "$payload" \
              "https://api.github.com/repos/sxwzxc/multigitguipage/releases" > /tmp/target.json
            echo "Created new release ${tag}"
          else
            echo "Release ${tag} already exists, reusing it"
          fi
          id="$(jq -r .id /tmp/target.json)"
          upload_base="$(jq -r .upload_url /tmp/target.json | sed 's/{?name,label}//')"
          echo "id=${id}" >> "$GITHUB_OUTPUT"
          echo "upload_base=${upload_base}" >> "$GITHUB_OUTPUT"
          jq -r '.assets[] | [.name, .id] | @tsv' /tmp/target.json > /tmp/existing-assets.tsv

      - name: Forward assets
        env:
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upload_base="${{ steps.target.outputs.upload_base }}"
          mkdir -p /tmp/assets-dl
          while IFS=$'\t' read -r name url expected_size; do
            name="$(basename -- "$name")"
            local_path="/tmp/assets-dl/${name}"

            # 目标 release 已有同名资产则先删除，保持最新
            if [ -f /tmp/existing-assets.tsv ]; then
              asset_id="$(awk -F '\t' -v n="$name" '$1 == n { print $2; exit }' /tmp/existing-assets.tsv)"
              if [ -n "$asset_id" ]; then
                curl -fsSL -X DELETE -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                  "https://api.github.com/repos/sxwzxc/multigitguipage/releases/assets/${asset_id}"
                echo "removed stale asset: ${name}"
              fi
            fi

            # 从 private 仓库下载
            curl -fsSL -H "Authorization: Bearer ${GH_API_TOKEN}" -H "Accept: application/octet-stream" \
              -o "${local_path}" "${url}"

            actual_size="$(stat -c%s "${local_path}")"
            if [ "$actual_size" != "$expected_size" ]; then
              echo "::error::Download size mismatch for ${name}: expected ${expected_size}, got ${actual_size}"
              exit 1
            fi
            if [[ "$name" == *.exe ]]; then
              hex="$(head -c 2 "${local_path}" | xxd -p -c 2)"
              if [ "$hex" != "4d5a" ]; then
                echo "::error::${name} does not start with MZ (got ${hex}) - possible multipart pollution or JSON error response"
                exit 1
              fi
            fi
            if [[ "${name,,}" == "changelog.md" ]]; then
              first_char="$(head -c 1 "${local_path}")"
              if [ "$first_char" = "{" ] || [ "$first_char" = "<" ]; then
                echo "::error::${name} looks like JSON/HTML, not Markdown"
                exit 1
              fi
            fi

            # 上传到 public 仓库 release（原始二进制，禁止 multipart -F）
            qname="$(jq -rn --arg v "$name" '$v|@uri')"
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              -T "${local_path}" \
              "${upload_base}?name=${qname}" > /tmp/upload-resp.json

            resp_state="$(jq -r .state /tmp/upload-resp.json)"
            resp_size="$(jq -r .size /tmp/upload-resp.json)"
            if [ "$resp_state" != "uploaded" ]; then
              echo "::error::Upload failed for ${name}: state=${resp_state}"
              cat /tmp/upload-resp.json
              exit 1
            fi
            if [ "$resp_size" != "$actual_size" ]; then
              echo "::error::Upload size mismatch for ${name}: local=${actual_size}, remote=${resp_size}"
              exit 1
            fi
            echo "forwarded: ${name} (${actual_size} bytes)"
            rm -f "${local_path}"
          done < /tmp/assets.tsv

      - name: Trigger installer update workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.source.outputs.tag }}"
          payload="$(jq -n --arg ref "main" --arg tag "$tag" '{ref: $ref, inputs: {tag: $tag}}')"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d "$payload" \
            "https://api.github.com/repos/sxwzxc/multigitguipage/actions/workflows/update-installer.yml/dispatches"
          echo "Dispatched update-installer.yml for tag ${tag}"
